<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Roni's PRO — Premium Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Outfit',-apple-system,'Segoe UI',Roboto,sans-serif;
  --radius-btn:24px;
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --dur:.45s;
}
[data-theme="dark"]{
  --bg-1:#070912; --bg-2:#0c1020;
  --blob-1:#5b21ff; --blob-2:#00c8ff; --blob-3:#ff2ea6;
  --surface:rgba(255,255,255,.06);
  --surface-border:rgba(255,255,255,.12);
  --btn:rgba(255,255,255,.08);
  --btn-hover:rgba(255,255,255,.14);
  --btn-fn:rgba(255,255,255,.14);
  --text:#f2f4ff; --text-dim:rgba(242,244,255,.55);
  --accent-1:#7c5cff; --accent-2:#00d4ff;
  --glow:0 0 24px rgba(124,92,255,.45), 0 0 60px rgba(0,212,255,.18);
  --op-glow:0 0 18px rgba(0,212,255,.35);
  --hist-bg:rgba(13,16,32,.92);
  --shadow:0 20px 60px rgba(0,0,0,.55);
}
[data-theme="light"]{
  --bg-1:#eef1f8; --bg-2:#e3e8f4;
  --blob-1:#a78bfa; --blob-2:#67e8f9; --blob-3:#f9a8d4;
  --surface:rgba(255,255,255,.65);
  --surface-border:rgba(255,255,255,.9);
  --btn:rgba(255,255,255,.85);
  --btn-hover:#ffffff;
  --btn-fn:#dfe4f2;
  --text:#171b2e; --text-dim:rgba(23,27,46,.5);
  --accent-1:#6d4aff; --accent-2:#00a8cc;
  --glow:0 8px 30px rgba(109,74,255,.35);
  --op-glow:0 6px 20px rgba(0,168,204,.3);
  --hist-bg:rgba(255,255,255,.94);
  --shadow:0 20px 60px rgba(30,40,80,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg-1);
  color:var(--text);
  overflow:hidden;
  transition:background .6s var(--ease-out), color .6s var(--ease-out);
  display:flex;justify-content:center;align-items:stretch;
}
.aurora{position:fixed;inset:0;overflow:hidden;z-index:0;filter:blur(90px);opacity:.55;pointer-events:none}
.blob{position:absolute;border-radius:50%;opacity:.7;will-change:transform}
.blob.b1{width:55vmax;height:55vmax;background:var(--blob-1);top:-20vmax;left:-15vmax;animation:drift1 26s ease-in-out infinite alternate}
.blob.b2{width:45vmax;height:45vmax;background:var(--blob-2);bottom:-18vmax;right:-12vmax;animation:drift2 32s ease-in-out infinite alternate}
.blob.b3{width:35vmax;height:35vmax;background:var(--blob-3);top:35%;left:55%;animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-14vmax,-16vmax) scale(1.1)}}
@keyframes drift3{to{transform:translate(-20vmax,10vmax) scale(.85)}}

.app{
  position:relative;z-index:1;
  width:100%;max-width:430px;
  display:flex;flex-direction:column;
  height:100dvh;
  padding:max(14px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));
}

/* ─── Header ─── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:.3px}
.brand .logo{
  width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  box-shadow:var(--glow);font-size:16px;color:#fff;
  animation:logoIn .9s var(--ease-spring) both;
}
@keyframes logoIn{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.top-actions{display:flex;gap:8px}
.icon-btn{
  width:40px;height:40px;border-radius:14px;border:1px solid var(--surface-border);
  background:var(--surface);color:var(--text);cursor:pointer;font-size:17px;
  display:grid;place-items:center;transition:transform .25s var(--ease-spring), background .3s;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.icon-btn:active{transform:scale(.88)}
.theme-switch{position:relative;width:52px;height:28px;border-radius:99px;border:1px solid var(--surface-border);
  background:var(--surface);cursor:pointer;transition:background .4s}
.knob{position:absolute;top:2.5px;left:3px;width:21px;height:21px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  box-shadow:var(--glow);transition:transform .5s var(--ease-spring)}
[data-theme="light"] .knob{transform:translateX(23px)}

/* ─── Display ─── */
.display{
  flex:0 0 auto;margin-top:6px;padding:18px 20px 14px;border-radius:26px;
  background:var(--surface);border:1px solid var(--surface-border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:flex-end;gap:8px;
  min-height:120px;justify-content:center;overflow:hidden;
  animation:rise .7s var(--ease-out) both .1s;
}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.expr{color:var(--text-dim);font-size:16px;font-weight:400;min-height:20px;
  max-width:100%;white-space:nowrap;overflow-x:auto;scrollbar-width:none;display:flex;align-items:center;letter-spacing:1px}
.expr::-webkit-scrollbar{display:none}
.expr .caret{display:inline-block;width:2px;height:1.1em;background:linear-gradient(var(--accent-1),var(--accent-2));
  margin-left:2px;border-radius:2px;animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.result{
  font-size:clamp(34px,11vw,54px);font-weight:600;letter-spacing:-1px;
  max-width:100%;white-space:nowrap;overflow-x:auto;scrollbar-width:none;
  transition:font-size .2s var(--ease-out);
}
.result::-webkit-scrollbar{display:none}
.result.pop{animation:pop .45s var(--ease-spring)}
@keyframes pop{0%{transform:scale(.7);opacity:.2;filter:blur(4px)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
.result.error{color:#ff5470}
.display.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.result.glowText{text-shadow:0 0 22px rgba(0,212,255,.35)}

/* ─── Keypad ─── */
.pad{
  margin-top:16px;flex:1;display:grid;
  grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:12px;
  animation:rise .7s var(--ease-out) both .22s;
}
.key{
  border:none;border-radius:var(--radius-btn);
  background:var(--btn);color:var(--text);
  font-family:var(--font);font-size:23px;font-weight:500;
  cursor:pointer;position:relative;overflow:hidden;user-select:none;
  display:grid;place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 6px 16px rgba(0,0,0,.18);
  transition:background .25s, transform .18s var(--ease-spring), box-shadow .25s;
}
.key:active{transform:scale(.9);background:var(--btn-hover)}
.key.fn{background:var(--btn-fn);color:var(--accent-2);font-size:21px;font-weight:600}
.key.op{color:var(--accent-1);font-size:27px;font-weight:600}
.key.op.active{background:linear-gradient(135deg,var(--accent-1),var(--accent-2));color:#fff;box-shadow:var(--glow)}
.key.ac{color:#ff5470;font-weight:700}
.key.eq{
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  color:#fff;font-size:30px;box-shadow:var(--glow);
}
.key.eq:active{transform:scale(.9);filter:brightness(1.15)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);
  transform:scale(0);animation:rip .55s var(--ease-out);pointer-events:none}
[data-theme="light"] .ripple{background:rgba(109,74,255,.25)}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* ─── History ─── */
.history-panel{
  position:absolute;inset:0;z-index:10;
  background:var(--hist-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:28px;display:flex;flex-direction:column;
  transform:translateX(105%);transition:transform .55s var(--ease-out);
  box-shadow:var(--shadow);
}
.history-panel.open{transform:translateX(0)}
.hist-head{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px}
.hist-head h2{font-size:19px;font-weight:600;display:flex;align-items:center;gap:9px}
.hist-list{flex:1;overflow-y:auto;padding:4px 14px 20px;display:flex;flex-direction:column;gap:10px}
.hist-list::-webkit-scrollbar{width:0}
.hist-item{
  background:var(--surface);border:1px solid var(--surface-border);
  border-radius:18px;padding:13px 16px;cursor:pointer;
  transition:transform .25s var(--ease-spring), background .25s;
  animation:itemIn .45s var(--ease-spring) both;
}
@keyframes itemIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.hist-item:active{transform:scale(.96);background:var(--btn-hover)}
.hist-item .h-expr{font-size:13px;color:var(--text-dim);margin-bottom:3px;word-break:break-all}
.hist-item .h-res{font-size:21px;font-weight:600;word-break:break-all}
.hist-empty{flex:1;display:grid;place-items:center;color:var(--text-dim);font-size:15px;text-align:center;line-height:1.7;padding:20px}
/* ─── Scientific fold panel ─── */
.sci-wrap{
  display:grid;grid-template-rows:0fr;opacity:0;margin-top:0;
  transition:grid-template-rows .55s var(--ease-out), opacity .4s var(--ease-out), margin-top .55s var(--ease-out);
}
.sci-wrap.open{grid-template-rows:1fr;opacity:1;margin-top:14px}
.sci-inner{overflow:hidden;min-height:0}
.sci-pad{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:9px;padding-top:2px}
.sci-pad{height:132px}
.icon-btn.active{background:linear-gradient(135deg,var(--accent-1),var(--accent-2));color:#fff;box-shadow:var(--glow);border-color:transparent}
.danger-btn{color:#ff5470;font-size:14px;font-weight:600;background:none;border:none;cursor:pointer;
  font-family:var(--font);padding:8px 10px;border-radius:12px;transition:background .25s}
.danger-btn:active{background:rgba(255,84,112,.12)}
</style>
</head>
<body>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="app">
  <div class="topbar">
    <div class="brand"><div class="logo">≡</div><span data-i18n="brand">Roni's PRO</span></div>
    <div class="top-actions">
      <button class="theme-switch" id="themeSwitch" aria-label="theme"><div class="knob"></div></button>
      <button class="icon-btn" id="sciBtn" aria-label="scientific">ƒx</button>
      <button class="icon-btn" id="histBtn" aria-label="history">🕘</button>
    </div>
  </div>

  <div class="display" id="display">
    <div class="expr" id="expr"><span class="caret"></span></div>
    <div class="result glowText" id="result">0</div>
  </div>

  <div class="sci-wrap" id="sciWrap">
    <div class="sci-inner"><div class="sci-pad" id="sciPad"></div></div>
  </div>

  <div class="pad" id="pad"></div>

  <div class="history-panel" id="histPanel">
    <div class="hist-head">
      <h2>🕘 <span data-i18n="history">History</span></h2>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="danger-btn" id="clearHist">✕ <span data-i18n="clear">Clear</span></button>
        <button class="icon-btn" id="closeHist">✕</button>
      </div>
    </div>
    <div class="hist-list" id="histList"><div class="hist-empty" data-i18n="no-hist">কোনো হিস্ট্রি নেই যেত 🧮<br>হিসাব শুরু করো!</div></div>
  </div>
</div>

<script>
(() => {
  const exprEl = document.getElementById('expr');
  const resultEl = document.getElementById('result');
  const displayEl = document.getElementById('display');
  const padEl = document.getElementById('pad');
  const histPanel = document.getElementById('histPanel');
  const histList = document.getElementById('histList');
  const sciWrap = document.getElementById('sciWrap');
  const sciPad = document.getElementById('sciPad');
  const sciBtn = document.getElementById('sciBtn');

  let tokens = [];
  let justEvaluated = false;

  const keys = [
    {t:'AC', c:'fn ac',  a:'clear'},
    {t:'%',  c:'fn',     a:'percent'},
    {t:'⌫',  c:'fn',     a:'back'},
    {t:'÷',  c:'op',     a:'op', v:'÷'},
    {t:'7',a:'num'},{t:'8',a:'num'},{t:'9',a:'num'},
    {t:'×', c:'op', a:'op', v:'×'},
    {t:'4',a:'num'},{t:'5',a:'num'},{t:'6',a:'num'},
    {t:'−', c:'op', a:'op', v:'−'},
    {t:'1',a:'num'},{t:'2',a:'num'},{t:'3',a:'num'},
    {t:'+', c:'op', a:'op', v:'+'},
    {t:'±',c:'fn', a:'sign'},
    {t:'0',a:'num'},
    {t:'.',a:'num', v:'.'},
    {t:'=',c:'eq',  a:'equals'},
  ];
  keys.forEach(k => {
    const b = document.createElement('button');
    b.className = 'key ' + (k.c || '');
    b.textContent = k.t;
    b.dataset.a = k.a;
    if (k.v) b.dataset.v = k.v;
    padEl.appendChild(b);
  });

  const sciKeys = [
    {t:'(', a:'paren', v:'('},
    {t:')', a:'paren', v:')'},
    {t:'√', c:'fn', a:'fnTok', v:'√'},
    {t:'x²', a:'sq'},
    {t:'1⁄x', a:'inv'},
    {t:'π', a:'const', v:'π'},
    {t:'e', a:'const', v:'e'},
    {t:'ln', c:'fn', a:'fnTok', v:'ln'},
    {t:'log', c:'fn', a:'fnTok', v:'log'},
    {t:'xʸ', c:'op', a:'op', v:'^'},
  ];
  sciKeys.forEach(k => {
    const b = document.createElement('button');
    b.className = 'key sci ' + (k.c || '');
    b.textContent = k.t;
    b.dataset.a = k.a;
    if (k.v) b.dataset.v = k.v;
    sciPad.appendChild(b);
  });

  function buzz(ms = 12){ if (navigator.vibrate) navigator.vibrate(ms); }

  function lastToken(){ return tokens[tokens.length - 1]; }
  function isOp(t){ return t && (t === '+' || t === '−' || t === '×' || t === '÷'); }

  function renderInput(){
    const caret = '<span class="caret"></span>';
    exprEl.innerHTML = (tokens.join(' ') || '') + caret;
    if (justEvaluated){ resultEl.textContent = tokens.join('') || '0'; }
    exprEl.scrollLeft = exprEl.scrollWidth;
    fitResult();
  }

  function fitResult(){
    let s = 52;
    resultEl.style.fontSize = '';
    while (resultEl.scrollWidth > resultEl.clientWidth && s > 20){
      s -= 2; resultEl.style.fontSize = s + 'px';
    }
  }

  function fmt(n){
    if (!isFinite(n)) return 'Error';
    if (Math.abs(n) >= 1e12 || (Math.abs(n) < 1e-9 && n !== 0)) return n.toExponential(6).replace(/(\.\d*?)0+e/, '$1e').replace(/\.e/, 'e');
    let s = parseFloat(n.toPrecision(12)).toString();
    return s;
  }

  function isFn(t){ return t === '√' || t === 'ln' || t === 'log'; }
  function isConst(t){ return t === 'π' || t === 'e'; }
  function isValue(t){ return t && !isOp(t) && !isFn(t) && t !== '(' && t !== ')'; }

  function evaluate(tk){
    const fns = {'√':Math.sqrt, 'ln':Math.log, 'log':Math.log10};
    const consts = {'π':Math.PI, 'e':Math.E};
    const prec = {'+':1, '−':1, '×':2, '÷':2, '^':4};
    const right = {'^':true};
    const out = [], ops = [];
    for (const t of tk){
      if (consts[t] !== undefined) out.push(consts[t]);
      else if (isFn(t)) ops.push(t);
      else if (t === '(') ops.push(t);
      else if (t === ')'){
        while (ops.length && ops[ops.length-1] !== '(') out.push(ops.pop());
        if (!ops.length) return NaN;
        ops.pop();
        if (ops.length && isFn(ops[ops.length-1])) out.push(ops.pop());
      }
      else if (prec[t] !== undefined){
        while (ops.length && ops[ops.length-1] !== '(' &&
          (isFn(ops[ops.length-1]) || prec[ops[ops.length-1]] > prec[t] ||
          (prec[ops[ops.length-1]] === prec[t] && !right[t]))) out.push(ops.pop());
        ops.push(t);
      }
      else out.push(parseFloat(t.replace('−', '-')));
    }
    while (ops.length){
      const o = ops.pop();
      if (o === '(') return NaN;
      out.push(o);
    }
    const st = [];
    for (const t of out){
      if (typeof t === 'number'){ st.push(t); continue; }
      if (isFn(t)){
        const a = st.pop();
        if (a === undefined) return NaN;
        st.push(fns[t](a));
      } else {
        const b = st.pop(), a = st.pop();
        if (a === undefined || b === undefined) return NaN;
        if (t === '+') st.push(a + b);
        else if (t === '−') st.push(a - b);
        else if (t === '×') st.push(a * b);
        else if (t === '÷') st.push(b === 0 ? NaN : a / b);
        else if (t === '^') st.push(Math.pow(a, b));
      }
    }
    return st.length === 1 ? st[0] : NaN;
  }

  function press(key, btn, ev){
    buzz();
    if (ev){ ripple(btn, ev); }
    const a = key.dataset.a, v = key.dataset.v;

    if (justEvaluated && !['equals','op','percent','sign','sq','inv','fnTok','paren'].includes(a)){
      tokens = []; justEvaluated = false;
      resultEl.textContent = '0';
    }
    if (justEvaluated && (a === 'op')){ /* continue from result */ }

    const last = lastToken();

    switch(a){
      case 'num': {
        if (isOp(last) || !last) tokens.push(v || key.textContent.trim());
        else {
          if (v === '.' && last.includes('.')) break;
          if (last.length >= 15) break;
          let next = (justEvaluated ? '' : last) + (v || key.textContent.trim());
          if (next === '.') next = '0.';
          tokens[tokens.length - 1] = next;
        }
        express();
        break;
      }
      case 'op': {
        justEvaluated = false;
        const op = v;
        if (!last && op !== '−') break;
        if (isOp(last)) tokens[tokens.length - 1] = op;
        else tokens.push(op);
        highlightOp(op);
        express();
        break;
      }
      case 'percent': {
        justEvaluated = false;
        if (!last || isOp(last)) break;
        tokens[tokens.length - 1] = fmt(parseFloat(last.replace('−', '-')) / 100);
        express();
        break;
      }
      case 'paren': {
        justEvaluated = false;
        const p = v;
        if (p === '('){
          if (!last || isOp(last) || last === '(' || isFn(last)) tokens.push('(');
        } else {
          const open = tokens.filter(x => x === '(').length, close = tokens.filter(x => x === ')').length;
          if (open > close && last && !isOp(last) && last !== '(') tokens.push(')');
        }
        express();
        break;
      }
      case 'fnTok': {
        justEvaluated = false;
        if (!last || isOp(last) || last === '(') tokens.push(v);
        express();
        break;
      }
      case 'const': {
        justEvaluated = false;
        if (!last || isOp(last) || last === '(') tokens.push(v);
        express();
        break;
      }
      case 'sq': {
        justEvaluated = false;
        if (!last || isOp(last) || last === '(') break;
        tokens[tokens.length - 1] = fmt(Math.pow(parseFloat(last.replace('−', '-')), 2));
        express();
        break;
      }
      case 'inv': {
        justEvaluated = false;
        if (!last || isOp(last) || last === '(') break;
        tokens[tokens.length - 1] = fmt(1 / parseFloat(last.replace('−', '-')));
        express();
        break;
      }
      case 'sign': {
        justEvaluated = false;
        if (!last || isOp(last)) {
          tokens.push('-0');
          express(); break;
        }
        tokens[tokens.length - 1] = last.startsWith('-') ? last.slice(1) : '-' + last;
        express();
        break;
      }
      case 'back': {
        justEvaluated = false;
        if (!last) break;
        if (isOp(last) || last === '(' || last === ')' || last === 'π' || last === 'e' || isFn(last)) tokens.pop();
        else if (last.length === 1 || (last.length === 2 && last.startsWith('-'))) tokens.pop();
        else tokens[tokens.length - 1] = last.slice(0, -1);
        highlightOp(null);
        express();
        break;
      }
      case 'clear': {
        buzz(30);
        tokens = []; justEvaluated = false;
        resultEl.textContent = '0';
        resultEl.classList.remove('error');
        highlightOp(null);
        renderInput();
        break;
      }
      case 'equals': {
        let tk = [...tokens];
        while (tk.length && !isValue(tk[tk.length - 1])) tk.pop();
        if (tk.length < 2) break;
        const val = evaluate(tk);
        const exprStr = tk.join(' ');
        if (!isFinite(val)){
          resultEl.textContent = 'Error';
          resultEl.classList.add('error');
          displayEl.classList.remove('shake'); void displayEl.offsetWidth;
          displayEl.classList.add('shake');
          buzz([60,40,60]);
          tokens = [];
          renderInput();
          break;
        }
        const res = fmt(val);
        resultEl.classList.remove('error', 'pop'); void resultEl.offsetWidth;
        resultEl.classList.add('pop');
        resultEl.textContent = res;
        saveHistory(exprStr, res);
        tokens = [res];
        justEvaluated = true;
        highlightOp(null);
        renderInput();
        break;
      }
    }
  }

  function express(){
    highlightOp(null);
    resultEl.classList.remove('error');
    renderInput();
  }

  function highlightOp(op){
    padEl.querySelectorAll('.key.op').forEach(b => b.classList.toggle('active', op && b.dataset.v === op));
  }

  function ripple(btn, ev){
    const r = document.createElement('span');
    r.className = 'ripple';
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    r.style.width = r.style.height = size + 'px';
    r.style.left = (ev.clientX ? ev.clientX - rect.left : rect.width / 2) - size / 2 + 'px';
    r.style.top = (ev.clientY ? ev.clientY - rect.top : rect.height / 2) - size / 2 + 'px';
    btn.appendChild(r);
    setTimeout(() => r.remove(), 600);
  }

  padEl.addEventListener('pointerdown', e => {
    const btn = e.target.closest('.key');
    if (btn) press(btn, btn, e);
  });

  sciPad.addEventListener('pointerdown', e => {
    const btn = e.target.closest('.key');
    if (btn) press(btn, btn, e);
  });

  sciBtn.addEventListener('click', () => {
    sciWrap.classList.toggle('open');
    sciBtn.classList.toggle('active');
    buzz();
  });

  document.addEventListener('keydown', e => {
    const map = {'/':'÷', '*':'×', '-':'−', '+':'+', 'Enter':'=', '=':'=', 'Backspace':'⌫', 'Escape':'clear', 'Delete':'clear'};
    let target = null;
    if (/^[0-9.]$/.test(e.key)){
      target = [...padEl.querySelectorAll('.key')].find(b => b.textContent === e.key);
    } else if (map[e.key]){
      target = [...padEl.querySelectorAll('.key')].find(b =>
        e.key === 'clear' ? b.dataset.a === 'clear' : b.textContent === map[e.key] || (e.key === '%' && b.dataset.v === '%'));
    }
    if (e.key === '%') target = [...padEl.querySelectorAll('.key')].find(b => b.dataset.a === 'percent');
    if (target){ e.preventDefault(); press(target, target); }
  });

  /* ─── History ─── */
  function getHistory(){ try { return JSON.parse(localStorage.getItem('ronis-pro-history') || '[]'); } catch { return []; } }
  function saveHistory(expr, res){
    const h = getHistory();
    h.unshift({expr, res, t: Date.now()});
    localStorage.setItem('ronis-pro-history', JSON.stringify(h.slice(0, 50)));
    renderHistory();
  }
  function renderHistory(){
    const h = getHistory();
    if (!h.length){
      histList.innerHTML = '<div class="hist-empty">কোনো হিস্ট্রি নেই এখনো 🧮<br>হিসাব শুরু করো!</div>';
      return;
    }
    histList.innerHTML = '';
    h.forEach((item, i) => {
      const d = document.createElement('div');
      d.className = 'hist-item';
      d.style.animationDelay = (i * 0.05) + 's';
      d.innerHTML = `<div class="h-expr">${item.expr}</div><div class="h-res">${item.res}</div>`;
      d.addEventListener('click', () => {
        tokens = [item.res];
        justEvaluated = true;
        resultEl.textContent = item.res;
        resultEl.classList.remove('error','pop'); void resultEl.offsetWidth;
        resultEl.classList.add('pop');
        renderInput();
        histPanel.classList.remove('open');
        buzz();
      });
      histList.appendChild(d);
    });
  }
  document.getElementById('histBtn').addEventListener('click', () => { histPanel.classList.add('open'); renderHistory(); buzz(); });
  document.getElementById('closeHist').addEventListener('click', () => histPanel.classList.remove('open'));
  document.getElementById('clearHist').addEventListener('click', () => {
    localStorage.removeItem('ronis-pro-history');
    renderHistory(); buzz(30);
  });

  /* ─── Theme ─── */
  const themeSwitch = document.getElementById('themeSwitch');
  function applyTheme(t){
    document.documentElement.dataset.theme = t;
    localStorage.setItem('ronis-pro-theme', t);
    document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#070912' : '#eef1f8';
  }
  themeSwitch.addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    buzz();
  });
  applyTheme(localStorage.getItem('ronis-pro-theme') || 'dark');

  renderInput();
})();
</script>
</body>
</html>
